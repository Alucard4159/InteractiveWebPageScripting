<!DOCTYPE html>
<html lang="en">
<head>
	<title>Welcome to Barovia</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link href="includes/style.css" rel="stylesheet" type="text/css" />
	<script src="includes/jquery.min.js" type="text/javascript"></script>
</head>
<script type="text/javascript">
	var queryString2 = new Array();
	$(function() {
		$(document).ready(function() {
			const getQueryParams = (url) => {
				let qParams = {};
				let qStrings = new URL(url, window.location.origin).searchParams;
				qStrings.forEach((value, key) => {
					if (!key) {
						return;
					}
					qParams[key] = value;
				});
				return qParams;
			};
			queryString2 = getQueryParams(window.location.href);
			var fname = queryString2.fname;
			var lname = queryString2.lname || "";
			var skillType = queryString2.skillType || "";
			if (!fname) {
				return;
			}
			var $cxt = $('#cxt').empty();
			$cxt.append($('<p></p>').text('Hello ' + fname + ' ' + lname + ','));
			$cxt.append($('<p></p>').text('I hear you are a renowned ' + skillType + '.'));
			$cxt.append($('<p></p>').text('I have allowed you passage into my land, and know that I alone can release you from it.'));
			$cxt.append($('<p></p>').text('Come see me at my castle if your reputation has any merit behind it.'));
			$cxt.append($('<p></p>').text('The Dread Lord and Master,'));
			$cxt.append($('<p></p>').text('Strahd von Barovich'));
		});
		$('#myBtn').on('click', () => {
			window.location.href = "Destiny.html";
		});
	});
</script>
<body>
	<header>
		<h1>Welcome to Barovia</h1>
	</header>
	<nav></nav>

	<div id="wrapper2">
		<section id="cxt"></section>
		<div class="myBtn" id="myBtn" title="Map View">Accept Invitation</div>
	</div>

	<footer>
		<p>Jessie Higgins | &copy; D&D | WBG310</p>
	</footer>
</body>
</html>
